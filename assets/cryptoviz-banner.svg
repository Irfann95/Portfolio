<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0d2b3a"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8233a"/>
      <stop offset="100%" stop-color="#ff5a3c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgGrad2)"/>

  <!-- ticker line chart -->
  <polyline points="360,140 390,120 410,150 440,90 465,110 495,60 520,95 550,70"
            fill="none" stroke="#3ddc97" stroke-width="3" opacity="0.85"/>
  <polyline points="360,140 390,120 410,150 440,90 465,110 495,60 520,95 550,70"
            fill="none" stroke="#3ddc97" stroke-width="0" />

  <rect x="40" y="46" width="10" height="10" rx="2" fill="url(#accentGrad2)"/>
  <text x="60" y="56" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.7" letter-spacing="2">REAL-TIME DATA PIPELINE</text>

  <text x="40" y="112" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Crypto Viz</text>
  <text x="40" y="144" font-family="Arial, sans-serif" font-size="16" fill="#bfe3f2">Analytics crypto en temps réel via streaming Kafka</text>

  <!-- streaming pipeline -->
  <g font-family="Arial, sans-serif" font-size="12" font-weight="600">
    <rect x="40" y="180" width="92" height="30" rx="15" fill="#ff5a3c" opacity="0.9"/>
    <text x="86" y="199" fill="#1a1a1a" text-anchor="middle">CoinGecko</text>

    <path d="M136 195 L152 195" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>

    <rect x="156" y="180" width="70" height="30" rx="15" fill="#ffffff" opacity="0.9"/>
    <text x="191" y="199" fill="#1a1a1a" text-anchor="middle">Kafka</text>

    <path d="M230 195 L246 195" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>

    <rect x="250" y="180" width="110" height="30" rx="15" fill="#3ddc97" opacity="0.9"/>
    <text x="305" y="199" fill="#1a1a1a" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- tech chips -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#ffffff">
    <rect x="40" y="240" width="78" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="79" y="257" text-anchor="middle">Kafka</text>

    <rect x="128" y="240" width="86" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="171" y="257" text-anchor="middle">FastAPI</text>

    <rect x="224" y="240" width="80" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="264" y="257" text-anchor="middle">Next.js</text>

    <rect x="314" y="240" width="98" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="363" y="257" text-anchor="middle">TypeScript</text>

    <rect x="422" y="240" width="80" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="462" y="257" text-anchor="middle">Docker</text>
  </g>

  <rect x="0" y="330" width="600" height="10" fill="url(#accentGrad2)"/>
</svg>
