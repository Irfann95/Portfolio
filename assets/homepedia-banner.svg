<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#3a0d0d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8233a"/>
      <stop offset="100%" stop-color="#ff5a3c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgGrad)"/>

  <!-- decorative map pin / commune dots -->
  <circle cx="500" cy="70" r="4" fill="#ff5a3c" opacity="0.9"/>
  <circle cx="530" cy="110" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="470" cy="120" r="2.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="550" cy="60" r="2" fill="#ffffff" opacity="0.3"/>
  <path d="M500 70 L530 110 M500 70 L470 120 M500 70 L550 60" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <rect x="40" y="46" width="10" height="10" rx="2" fill="url(#accentGrad)"/>
  <text x="60" y="56" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.7" letter-spacing="2">DATA ENGINEERING PROJECT</text>

  <text x="40" y="112" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Homepedia</text>
  <text x="40" y="144" font-family="Arial, sans-serif" font-size="16" fill="#f2c9c9">Où vivre selon ton budget réel, pas le loyer affiché</text>

  <!-- medallion architecture pipeline -->
  <g font-family="Arial, sans-serif" font-size="12.5" font-weight="600">
    <rect x="40" y="180" width="70" height="30" rx="15" fill="#cd7f32" opacity="0.85"/>
    <text x="75" y="199" fill="#1a1a1a" text-anchor="middle">Bronze</text>

    <path d="M114 195 L130 195" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="134" y="180" width="65" height="30" rx="15" fill="#c0c0c0" opacity="0.9"/>
    <text x="166" y="199" fill="#1a1a1a" text-anchor="middle">Silver</text>

    <path d="M203 195 L219 195" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>

    <rect x="223" y="180" width="60" height="30" rx="15" fill="#ffd54a"/>
    <text x="253" y="199" fill="#1a1a1a" text-anchor="middle">Gold</text>
  </g>

  <!-- tech chips -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#ffffff">
    <rect x="40" y="240" width="88" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="84" y="257" text-anchor="middle">PySpark</text>

    <rect x="136" y="240" width="98" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="185" y="257" text-anchor="middle">ClickHouse</text>

    <rect x="242" y="240" width="86" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="285" y="257" text-anchor="middle">FastAPI</text>

    <rect x="336" y="240" width="94" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="383" y="257" text-anchor="middle">Streamlit</text>

    <rect x="438" y="240" width="80" height="26" rx="13" fill="#ffffff" fill-opacity="0.12"/>
    <text x="478" y="257" text-anchor="middle">Docker</text>
  </g>

  <rect x="0" y="330" width="600" height="10" fill="url(#accentGrad)"/>
</svg>
